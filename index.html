<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="manifest" href="manifest.json" />

<title>Taller Elvira — Sistema de Gestión</title>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --border: #E8E4DC;
    --border-strong: #D6D1C6;
    --ink: #1A1814;
    --ink-soft: #5C574F;
    --ink-muted: #908A7E;
    --sidebar: #16130E;
    --sidebar-soft: #2A251E;
    --sidebar-text: #C9C5BD;
    --accent: #DC2626;
    --accent-hover: #B91C1C;
    --accent-soft: #FEE2E2;
    --success: #16A34A;
    --success-soft: #DCFCE7;
    --warning: #CA8A04;
    --warning-soft: #FEF9C3;
    --danger: #991B1B;
    --danger-soft: #FECACA;
  }
  * { -webkit-font-smoothing: antialiased; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.025) 1px, transparent 0);
    background-size: 24px 24px;
  }
  .font-display { font-family: 'Fraunces', serif; font-optical-sizing: auto; letter-spacing: -0.02em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  .serif-italic { font-family: 'Fraunces', serif; font-style: italic; }

  /* Sidebar */
  .sidebar { background: var(--sidebar); color: var(--sidebar-text); }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: 8px;
    color: var(--sidebar-text); font-weight: 500; font-size: 14px;
    transition: all 0.15s ease;
    cursor: pointer;
  }
  .nav-item:hover { background: var(--sidebar-soft); color: white; }
  .nav-item.active { background: var(--accent); color: white; }
  .nav-item.active .nav-badge { background: rgba(255,255,255,0.25); }
  .nav-badge {
    margin-left: auto;
    background: var(--sidebar-soft);
    color: white;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 99px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .card-tight { padding: 16px; }
  .card-pad { padding: 22px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 9px; font-weight: 600; font-size: 14px; transition: all 0.15s; cursor: pointer; border: 1px solid transparent; white-space: nowrap; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--border-strong); }
  .btn-ghost:hover { background: var(--bg); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: white; }
  .btn-danger-solid { background: var(--danger); color: white; border-color: var(--danger); }
  .btn-danger-solid:hover { background: #7F1D1D; border-color: #7F1D1D; }
  .btn-icon { padding: 8px; border-radius: 8px; cursor: pointer; color: var(--ink-soft); transition: all 0.15s; }
  .btn-icon:hover { background: var(--bg); color: var(--ink); }
  .btn-sm { padding: 6px 12px; font-size: 13px; }

  /* Inputs */
  .input, .select, .textarea {
    width: 100%;
    padding: 10px 13px;
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    background: var(--surface);
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    transition: all 0.15s;
  }
  .input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
  .badge-success { background: var(--success-soft); color: #166534; }
  .badge-warning { background: var(--warning-soft); color: #854D0E; }
  .badge-danger { background: var(--danger-soft); color: #991B1B; }
  .badge-neutral { background: var(--bg); color: var(--ink-soft); border: 1px solid var(--border); }
  .badge-accent { background: var(--accent-soft); color: #7F1D1D; }

  /* Tables */
  .table { width: 100%; border-collapse: collapse; }
  .table th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); background: #FBF9F5; }
  .table td { padding: 14px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
  .table tr:last-child td { border-bottom: 0; }
  .table tr:hover td { background: #FCFAF6; }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(22, 19, 14, 0.55); backdrop-filter: blur(4px); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 4vh 16px; overflow-y: auto; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.3); }
  .modal-wide { max-width: 720px; }

  /* Toast */
  #toast-host { position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { background: var(--ink); color: white; padding: 12px 18px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2); animation: toast-in 0.25s ease; display: flex; align-items: center; gap: 10px; }
  @keyframes toast-in { from { transform: translateY(20px); opacity: 0; } }

  /* Animations */
  .fade-in { animation: fade-in 0.25s ease; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } }

  /* KPI cards */
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .kpi-label { font-size: 12px; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .kpi-value { font-family: 'Fraunces', serif; font-size: 38px; font-weight: 500; line-height: 1; margin-top: 8px; letter-spacing: -0.02em; }
  .kpi-foot { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
  .kpi-icon { position: absolute; top: 18px; right: 18px; color: var(--ink-muted); opacity: 0.6; }

  /* Empty state */
  .empty { padding: 60px 20px; text-align: center; color: var(--ink-soft); }
  .empty-icon { display: inline-flex; padding: 16px; background: var(--bg); border-radius: 50%; color: var(--ink-muted); margin-bottom: 12px; }

  /* Quick action chip */
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
  .chip:hover { background: var(--bg); }
  .chip-wa { background: #25D366; color: white; border-color: #25D366; }
  .chip-wa:hover { background: #1FB958; }
  .chip-sms { background: #007AFF; color: white; border-color: #007AFF; }
  .chip-sms:hover { background: #0064D2; }
  .chip-mail { background: var(--ink); color: white; border-color: var(--ink); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-muted); }

  /* Mobile drawer */
  @media (max-width: 1023px) {
    #sidebar { position: fixed; inset: 0 auto 0 0; width: 260px; transform: translateX(-100%); transition: transform 0.25s; z-index: 40; display: flex !important; }
    #sidebar.open { transform: translateX(0); }
    #sidebar-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 35; display: none; }
    #sidebar-backdrop.open { display: block; }
  }

  /* Print-friendly hide */
  .no-print { /* placeholder */ }

  /* Subtle accent line */
  .accent-line { height: 3px; width: 36px; background: var(--accent); border-radius: 2px; }

  /* Message previews */
  .msg-preview-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 10px 0 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .msg-preview {
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-preview-wa {
    background: #DCF8C6;
    border: 1px solid #C5E8AC;
    border-bottom-left-radius: 4px;
    max-width: 90%;
    position: relative;
  }
  .msg-preview-wa::before {
    content: '';
    position: absolute;
    left: -8px;
    top: 0;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 10px 10px 0;
    border-color: transparent #DCF8C6 transparent transparent;
  }
  .msg-preview-sms {
    background: #E5E5EA;
    border: 1px solid #D5D5DA;
    border-bottom-left-radius: 4px;
    max-width: 85%;
    color: #000;
  }
  .msg-preview-email {
    background: #FFFFFF;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    font-family: -apple-system, Segoe UI, system-ui, sans-serif;
  }
  .msg-preview-empty {
    color: var(--ink-muted);
    font-style: italic;
  }

  /* Product images */
  .prod-thumb {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--bg);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .prod-thumb:hover { transform: scale(1.05); }
  .prod-thumb-placeholder {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-muted);
  }
  .image-drop {
    border: 2px dashed var(--border-strong);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--bg);
  }
  .image-drop:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .image-drop.dragging {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .image-preview-big {
    width: 100%;
    max-height: 220px;
    object-fit: contain;
    background: var(--bg);
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .image-viewer-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    cursor: zoom-out;
  }
  .image-viewer-backdrop img {
    max-width: 95%;
    max-height: 95vh;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  /* ========== TICKET / PRINT ========== */
  .ticket-doc {
    background: white;
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 44px;
    border: 1px solid var(--border);
    border-radius: 14px;
    color: #111;
    font-size: 13px;
    line-height: 1.5;
  }
  .ticket-doc h1, .ticket-doc h2, .ticket-doc h3 { font-family: 'Fraunces', serif; }
  .ticket-doc .t-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; border-bottom: 2px solid #111; padding-bottom: 18px; margin-bottom: 24px; }
  .ticket-doc .t-brand { display: flex; gap: 12px; align-items: center; }
  .ticket-doc .t-initials { width: 52px; height: 52px; background: var(--accent); color: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; }
  .ticket-doc .t-workshop-name { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .ticket-doc .t-workshop-meta { font-size: 11px; color: #555; margin-top: 2px; }
  .ticket-doc .t-folio { text-align: right; }
  .ticket-doc .t-folio-num { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; }
  .ticket-doc .t-folio-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #666; }
  .ticket-doc .t-blocks { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .ticket-doc .t-block-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #666; margin-bottom: 4px; font-weight: 600; }
  .ticket-doc .t-block-content { font-size: 13px; line-height: 1.5; }
  .ticket-doc .t-block-content strong { font-size: 14px; }
  .ticket-doc table.t-items { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
  .ticket-doc table.t-items th { text-align: left; padding: 8px 10px; background: #F5F5F5; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; border-bottom: 1px solid #ccc; }
  .ticket-doc table.t-items th.num, .ticket-doc table.t-items td.num { text-align: right; font-family: 'JetBrains Mono', monospace; }
  .ticket-doc table.t-items td { padding: 10px; border-bottom: 1px solid #EEE; }
  .ticket-doc .t-totals { margin-left: auto; width: 280px; }
  .ticket-doc .t-totals .row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
  .ticket-doc .t-totals .row.grand { border-top: 2px solid #111; margin-top: 6px; padding-top: 10px; font-size: 17px; font-family: 'Fraunces', serif; font-weight: 600; }
  .ticket-doc .t-totals .num { font-family: 'JetBrains Mono', monospace; }
  .ticket-doc .t-notes { margin-top: 22px; padding: 12px 14px; background: #FAFAFA; border-left: 3px solid var(--accent); font-size: 12px; }
  .ticket-doc .t-signatures { margin-top: 50px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .ticket-doc .t-sig { border-top: 1px solid #888; padding-top: 6px; text-align: center; font-size: 11px; color: #555; }
  .ticket-doc .t-foot { margin-top: 30px; padding-top: 14px; border-top: 1px solid #EEE; text-align: center; font-size: 10px; color: #888; }
  .ticket-status { display: inline-block; padding: 3px 9px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
  .ticket-status.pagado { background: #DCFCE7; color: #166534; }
  .ticket-status.pendiente { background: #FEF3C7; color: #854D0E; }
  .ticket-status.cancelado { background: #FECACA; color: #991B1B; text-decoration: line-through; }

  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: white !important; background-image: none !important; }
    #sidebar, #sidebar-backdrop, header, #page-actions, .no-print, .ticket-actions, #toast-host, #modal-host { display: none !important; }
    main { display: block !important; }
    #view { padding: 0 !important; }
    .ticket-doc { box-shadow: none; border: none; padding: 0; max-width: 100%; margin: 0; }
    .ticket-doc .t-header { border-bottom-color: #000; }
  }

  /* ============================================================
     BOTÓN Y ANIMACIÓN DE CERRAR SESIÓN
  ============================================================ */
  .logout-btn {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    padding: 11px 14px;
    overflow: hidden;
    border: 1px solid rgba(248, 113, 113, 0.28);
    border-radius: 9px;
    background: rgba(220, 38, 38, 0.08);
    color: #FECACA;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition:
      transform 0.22s ease,
      background 0.22s ease,
      color 0.22s ease,
      border-color 0.22s ease,
      box-shadow 0.22s ease;
  }

  .logout-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-110%);
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.17),
      transparent
    );
    transition: transform 0.55s ease;
  }

  .logout-btn:hover {
    color: white;
    background: var(--accent);
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(220, 38, 38, 0.25);
  }

  .logout-btn:hover::before {
    transform: translateX(110%);
  }

  .logout-btn:active {
    transform: scale(0.97);
  }

  .logout-icon,
  .logout-btn span {
    position: relative;
    z-index: 1;
  }

  .logout-icon {
    transition: transform 0.22s ease;
  }

  .logout-btn:hover .logout-icon {
    transform: translateX(4px) rotate(-8deg);
  }

  .logout-btn.is-loading {
    pointer-events: none;
    opacity: 0.72;
  }

  .logout-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
      radial-gradient(circle at top, rgba(220, 38, 38, 0.27), transparent 45%),
      rgba(22, 19, 14, 0.97);
    backdrop-filter: blur(12px);
    animation: logout-overlay-in 0.35s ease both;
  }

  .logout-card {
    width: min(420px, 100%);
    padding: 38px 30px;
    text-align: center;
    background: white;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 22px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
    animation: logout-card-in 0.55s
      cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .logout-symbol {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 12px 30px rgba(220, 38, 38, 0.35);
  }

  .logout-symbol svg {
    animation: logout-icon-move 0.75s ease-in-out infinite alternate;
  }

  .logout-title {
    margin-bottom: 7px;
    font-family: "Fraunces", serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--ink);
  }

  .logout-description {
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.6;
  }

  .logout-progress {
    height: 5px;
    margin-top: 24px;
    overflow: hidden;
    background: var(--accent-soft);
    border-radius: 99px;
  }

  .logout-progress::after {
    content: "";
    display: block;
    width: 100%;
    height: 100%;
    background: var(--accent);
    border-radius: inherit;
    transform: translateX(-100%);
    animation: logout-progress 1.1s ease forwards;
  }

  .logout-return-btn {
    margin-top: 24px;
    justify-content: center;
  }

  .app-logging-out {
    pointer-events: none;
    animation: app-logout 0.65s ease forwards;
  }

  @keyframes logout-overlay-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes logout-card-in {
    from {
      opacity: 0;
      transform: translateY(30px) scale(0.92);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @keyframes logout-icon-move {
    from { transform: translateX(-3px); }
    to { transform: translateX(5px); }
  }

  @keyframes logout-progress {
    to { transform: translateX(0); }
  }

  @keyframes app-logout {
    to {
      opacity: 0;
      transform: scale(0.97);
      filter: blur(5px);
    }
  }

<script>
/* ============================================================
   STORAGE LAYER
   Usa localStorage. Si el navegador no lo permite (modo privado
   con restricciones), cae a memoria — el sistema sigue
   funcionando hasta cerrar la pestaña.
============================================================ */
const _memStore = {};
let _storageMode = 'localStorage';
try {
  const _t = '__taller_test__';
  localStorage.setItem(_t, '1');
  localStorage.removeItem(_t);
} catch {
  _storageMode = 'memory';
  console.warn('localStorage no disponible — usando memoria temporal.');
}

const Storage = {
  get(key) {
    try {
      if (_storageMode === 'localStorage') return localStorage.getItem(key);
      return _memStore[key] ?? null;
    } catch { return _memStore[key] ?? null; }
  },
  set(key, value) {
    try {
      if (_storageMode === 'localStorage') localStorage.setItem(key, value);
      _memStore[key] = value;
      return { ok: true };
    } catch (e) {
      _memStore[key] = value;
      console.warn('Storage error:', e);
      const isQuota = e.name === 'QuotaExceededError' || e.code === 22 || /quota/i.test(e.message||'');
      return { ok: false, error: isQuota ? 'quota' : 'unknown', message: e.message };
    }
  }
};

function loadTable(name, def = []) {
  const raw = Storage.get(name);
  if (!raw) return def;
  try { return JSON.parse(raw); } catch { return def; }
}
function saveTable(name, data) {
  const r = Storage.set(name, JSON.stringify(data));
  if (!r.ok && r.error === 'quota') {
    toast('⚠ Almacenamiento lleno. Borra imágenes viejas o exporta respaldo.', 'alert-triangle');
  }
  return r.ok;
}

/* ============================================================
   IMAGE COMPRESSION
   Reduces images to ~50KB max for safe localStorage usage
============================================================ */
function compressImage(file, maxSize = 500, quality = 0.72) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type || !file.type.startsWith('image/')) {
      reject(new Error('El archivo no es una imagen válida'));
      return;
    }
    if (file.size > 15 * 1024 * 1024) {
      reject(new Error('La imagen es demasiado grande (máx 15MB)'));
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxSize) {
          height = Math.round((height / width) * maxSize);
          width = maxSize;
        } else if (height >= width && height > maxSize) {
          width = Math.round((width / height) * maxSize);
          height = maxSize;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        try {
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(dataUrl);
        } catch (err) {
          reject(err);
        }
      };
      img.onerror = () => reject(new Error('No se pudo cargar la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}

function viewFullImage(src) {
  const host = document.createElement('div');
  host.className = 'image-viewer-backdrop';
  host.onclick = () => host.remove();

  document.body.appendChild(host);
}

/* ============================================================
   STATE
============================================================ */
const state = {
  clientes: [],
  vehiculos: [],
  servicios: [],
  productos: [],
  tickets: [],
  config: {
    workshop: 'Taller Elvira',
    phone: '',
    country: '52',
    address: '',
    rfc: '',
    defaultMonths: 6,
    defaultKm: 5000,
    reminderDays: 30,
    reminderKm: 500,
    ivaPercent: 0,
    nextFolio: 1,
    folioPrefix: 'A',
    templateWhatsapp: 'Hola {nombre} 👋\n\nTe saluda *{taller}*.\n\nTu {marca} {modelo} {anio} (placa {placa}) tiene programado servicio para el *{fecha}*.\n\nÚltimo servicio: {ultimo_servicio_tipo} el {ultimo_servicio_fecha}.\n\n¿Te agendamos? Solo responde este mensaje 🔧',
    templateSms: 'Hola {nombre}, te saluda {taller}. Tu {marca} {modelo} ({placa}) tiene servicio programado para el {fecha}. ¿Te agendamos cita?',
    templateEmail: 'Hola {nombre},\n\nTe escribimos desde {taller}.\n\nTu vehículo {marca} {modelo} {anio} (placa {placa}) tiene programado un servicio para el {fecha}.\n\nÚltimo servicio realizado: {ultimo_servicio_tipo} el {ultimo_servicio_fecha}.\n\nResponde este correo para confirmar tu cita.\n\nSaludos,\n{taller}'
  },
  view: 'dashboard',
  search: ''
};

/* ============================================================
   UTILS
============================================================ */
const uid = (p='') => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const _pad = n => String(n).padStart(2, '0');
const _toISO = d => d.getFullYear() + '-' + _pad(d.getMonth()+1) + '-' + _pad(d.getDate());
const today = () => _toISO(new Date());
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoney = n => '$' + Number(n||0).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtKm = n => Number(n||0).toLocaleString('es-MX') + ' km';
function fmtDate(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-').map(Number);
  if (!y || !m || !d) return '—';
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' });
}
function addMonths(iso, months) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setMonth(dt.getMonth() + Number(months||0));
  return _toISO(dt);
}
function daysBetween(iso) {
  if (!iso) return null;
  const [y,m,d] = iso.split('-').map(Number);
  if (!y || !m || !d) return null;
  const target = new Date(y, m-1, d); target.setHours(0,0,0,0);
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((target - t) / 86400000);
}
function reminderStatus(diasParaServicio) {
  if (diasParaServicio == null) return null;
  if (diasParaServicio < 0) return { type:'overdue', label:`Vencido hace ${-diasParaServicio}d`, badge:'badge-danger' };
  if (diasParaServicio === 0) return { type:'today', label:'Hoy', badge:'badge-danger' };
  if (diasParaServicio <= state.config.reminderDays) return { type:'soon', label:`En ${diasParaServicio} días`, badge:'badge-warning' };
  return { type:'ok', label:`En ${diasParaServicio} días`, badge:'badge-success' };
}
function toast(msg, icon='check-circle') {
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${escapeHtml(msg)}</span>`;
  host.appendChild(el);
  lucide.createIcons();
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; el.style.transition='all 0.2s'; }, 2400);
  setTimeout(() => el.remove(), 2700);
}
function confirm2(message, opts = {}) {
  return new Promise(resolve => {
    const o = {
      description: opts.description || '',
      confirmText: opts.confirmText || 'Eliminar',
      cancelText: opts.cancelText || 'Cancelar',
      danger: opts.danger !== false,
      icon: opts.icon || 'alert-triangle'
    };
    const host = document.createElement('div');
    host.className = 'modal-backdrop';
    host.style.zIndex = '60';
    host.innerHTML = `
      <div class="modal fade-in" style="max-width: 440px; margin-top: 15vh;">
        <div class="p-6">
          <div class="flex gap-4 items-start">
            <div class="rounded-full ${o.danger ? 'bg-[var(--danger-soft)]' : 'bg-[var(--accent-soft)]'} flex items-center justify-center shrink-0" style="width:48px;height:48px">
              <i data-lucide="${o.icon}" style="color: ${o.danger ? 'var(--danger)' : 'var(--accent)'}; width:22px; height:22px"></i>
            </div>
            <div class="flex-1 min-w-0 pt-1">
              <div class="font-display text-xl font-semibold leading-tight">${escapeHtml(message)}</div>
              ${o.description ? `<div class="text-sm text-[var(--ink-soft)] mt-2 leading-relaxed">${escapeHtml(o.description)}</div>` : ''}
            </div>
          </div>
          <div class="flex justify-end gap-2 mt-6">
            <button type="button" class="btn btn-ghost" data-act="cancel">${escapeHtml(o.cancelText)}</button>
            <button type="button" class="btn ${o.danger ? 'btn-danger-solid' : 'btn-primary'}" data-act="ok">${escapeHtml(o.confirmText)}</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(host);
    lucide.createIcons();
    const done = (val) => {
      document.removeEventListener('keydown', keyHandler, true);
      host.style.opacity = '0';
      host.style.transition = 'opacity 0.15s';
      setTimeout(() => host.remove(), 150);
      resolve(val);
    };
    const keyHandler = (e) => {
      if (e.key === 'Escape') { e.stopImmediatePropagation(); e.preventDefault(); done(false); }
      else if (e.key === 'Enter') { e.preventDefault(); done(true); }
    };
    host.querySelector('[data-act="cancel"]').onclick = () => done(false);
    host.querySelector('[data-act="ok"]').onclick = () => done(true);
    host.onclick = (e) => { if (e.target === host) done(false); };
    document.addEventListener('keydown', keyHandler, true);
    setTimeout(() => host.querySelector('[data-act="ok"]').focus(), 60);
  });
}

function alert2(message, opts = {}) {
  return new Promise(resolve => {
    const o = {
      description: opts.description || '',
      okText: opts.okText || 'Entendido',
      icon: opts.icon || 'info',
      danger: opts.danger || false
    };
    const host = document.createElement('div');
    host.className = 'modal-backdrop';
    host.style.zIndex = '60';
    host.innerHTML = `
      <div class="modal fade-in" style="max-width: 440px; margin-top: 15vh;">
        <div class="p-6">
          <div class="flex gap-4 items-start">
            <div class="rounded-full ${o.danger ? 'bg-[var(--danger-soft)]' : 'bg-[var(--accent-soft)]'} flex items-center justify-center shrink-0" style="width:48px;height:48px">
              <i data-lucide="${o.icon}" style="color: ${o.danger ? 'var(--danger)' : 'var(--accent)'}; width:22px; height:22px"></i>
            </div>
            <div class="flex-1 min-w-0 pt-1">
              <div class="font-display text-xl font-semibold leading-tight">${escapeHtml(message)}</div>
              ${o.description ? `<div class="text-sm text-[var(--ink-soft)] mt-2 leading-relaxed">${escapeHtml(o.description)}</div>` : ''}
            </div>
          </div>
          <div class="flex justify-end mt-6">
            <button type="button" class="btn btn-primary" data-act="ok">${escapeHtml(o.okText)}</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(host);
    lucide.createIcons();
    const done = () => {
      document.removeEventListener('keydown', keyHandler, true);
      host.style.opacity = '0';
      host.style.transition = 'opacity 0.15s';
      setTimeout(() => host.remove(), 150);
      resolve();
    };
    const keyHandler = (e) => {
      if (e.key === 'Escape' || e.key === 'Enter') { e.stopImmediatePropagation(); e.preventDefault(); done(); }
    };
    host.querySelector('[data-act="ok"]').onclick = done;
    host.onclick = (e) => { if (e.target === host) done(); };
    document.addEventListener('keydown', keyHandler, true);
    setTimeout(() => host.querySelector('[data-act="ok"]').focus(), 60);
  });
}

function getInitials(name) {
  return (name || 'Taller Pro')
    .split(/\s+/).filter(Boolean).slice(0, 2)
    .map(w => w[0]).join('').toUpperCase() || 'T';
}

function clienteById(id) { return state.clientes.find(c => c.id === id); }
function vehiculoById(id) { return state.vehiculos.find(v => v.id === id); }
function vehiculosByCliente(id) { return state.vehiculos.filter(v => !v.deletedAt && v.clienteId === id); }
function serviciosByVehiculo(id) { return state.servicios.filter(s => !s.deletedAt && s.vehiculoId === id).sort((a,b)=>b.fecha.localeCompare(a.fecha)); }
function ultimoServicio(vehId) { return serviciosByVehiculo(vehId)[0]; }

/* ============================================================
   INICIALIZACIÓN SIN REGISTROS DE EJEMPLO
   Esta migración limpia una sola vez los datos anteriores guardados
   en el navegador. Los registros nuevos se conservarán normalmente.
============================================================ */
async function prepareEmptyInitialData() {
  const CLEAN_VERSION = '_taller_elvira_clean_v2';

  // Evita borrar nuevamente los datos que el usuario capture después.
  if (Storage.get(CLEAN_VERSION) === '1') return;

  state.clientes = [];
  state.vehiculos = [];
  state.servicios = [];
  state.productos = [];
  state.tickets = [];

  saveTable('clientes', []);
  saveTable('vehiculos', []);
  saveTable('servicios', []);
  saveTable('productos', []);
  saveTable('tickets', []);

  // Elimina la marca usada por los antiguos datos de demostración.
  Storage.set('_seeded', '');
  Storage.set(CLEAN_VERSION, '1');
}

async function persistAll() {
  await saveTable('clientes', state.clientes);
  await saveTable('vehiculos', state.vehiculos);
  await saveTable('servicios', state.servicios);
  await saveTable('productos', state.productos);
  await saveTable('tickets', state.tickets);
  await saveTable('config', state.config);
}

/* ============================================================
   NAVIGATION
============================================================ */
const NAV = [
  { key: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
  { key: 'recordatorios', label: 'Recordatorios', icon: 'bell-ring', badge: () => contarPendientes() },

/* ============================================================
   GENERIC SOFT-DELETE / RESTORE / TRASH HELPERS
============================================================ */
async function softDeleteEntity(table, id) {
  const arr = state[table];
  const idx = arr.findIndex(x => x.id === id);
  if (idx < 0) return false;
  arr[idx] = { ...arr[idx], deletedAt: new Date().toISOString() };
  await saveTable(table, arr);
  return true;
}

async function restoreEntity(table, id) {
  const arr = state[table];
  const idx = arr.findIndex(x => x.id === id);
  if (idx < 0) return false;
  const { deletedAt, ...rest } = arr[idx];
  arr[idx] = rest;
  await saveTable(table, arr);
  return true;
}

async function permanentDeleteEntity(table, id) {
  state[table] = state[table].filter(x => x.id !== id);
  await saveTable(table, state[table]);
}

const TRASH_LABELS = {
  clientes: { sing: 'cliente', plur: 'clientes' },
  vehiculos: { sing: 'vehículo', plur: 'vehículos' },
  servicios: { sing: 'servicio', plur: 'servicios' },
  tickets: { sing: 'ticket', plur: 'tickets' },
  productos: { sing: 'producto', plur: 'productos' }
};

async function emptyTrashFor(table) {
  const trashed = state[table].filter(x => x.deletedAt);
  if (trashed.length === 0) return;
  const lbl = TRASH_LABELS[table];
  const ok = await confirm2('¿Vaciar la papelera?', {
    description: `Se eliminarán permanentemente ${trashed.length} ${trashed.length === 1 ? lbl.sing : lbl.plur} de la papelera. Esta acción NO se puede deshacer.`,
    confirmText: 'Vaciar papelera'
  });
  if (!ok) return;
  state[table] = state[table].filter(x => !x.deletedAt);
  await saveTable(table, state[table]);
  toast('Papelera vaciada', 'trash-2');
  render();
}

function trashActionsHTML(table, label, addBtnHTML = '') {
  const trashed = state[table].filter(x => x.deletedAt);
  if (state.subview === 'trash') {
    return `
      <button class="btn btn-ghost btn-sm" onclick="toggleSubview()"><i data-lucide="arrow-left" class="w-4 h-4"></i>Volver</button>
      ${trashed.length > 0 ? `<button class="btn btn-danger-solid btn-sm" onclick="emptyTrashFor('${table}')"><i data-lucide="trash-2" class="w-4 h-4"></i>Vaciar papelera</button>` : ''}
    `;
  }
  return `
    <button class="btn btn-ghost btn-sm" onclick="toggleSubview()" title="Papelera"><i data-lucide="trash-2" class="w-4 h-4"></i>Papelera${trashed.length > 0 ? ' (' + trashed.length + ')' : ''}</button>
    ${addBtnHTML}
  `;
}

function trashHelpHTML(label) {
  return `
    <div class="mb-5 p-4 bg-[var(--accent-soft)] rounded-xl flex items-start gap-3" style="border:1px solid #FCA5A5">
      <i data-lucide="info" class="w-5 h-5 shrink-0 mt-0.5" style="color:var(--accent)"></i>
      <div class="text-sm" style="color:#7F1D1D">
        <strong>Papelera de ${label}.</strong> Aquí están los ${label} que eliminaste. Puedes <strong>restaurarlos</strong> o <strong>eliminarlos para siempre</strong>.
      </div>
    </div>
  `;
}

function diasEnPapeleraLabel(deletedAt) {
  if (!deletedAt) return '—';
  const d = daysBetween(deletedAt.slice(0,10));
  if (d === 0) return 'Hoy';
  if (d === -1) return 'Ayer';

/* ============================================================
   COUNTERS
============================================================ */
function contarPendientes() {
  return state.vehiculos.filter(v => {
    if (v.deletedAt) return false;
    const ult = ultimoServicio(v.id);
    if (!ult || !ult.proxFecha) return false;
    const d = daysBetween(ult.proxFecha);
    return d !== null && d <= state.config.reminderDays;
  }).length;
}
function contarStockBajo() {
  return state.productos.filter(p => !p.deletedAt && p.stock <= p.stockMin).length;
}

/* ============================================================
   RENDER ROUTER
============================================================ */
function render() {
  renderNav();
  const view = document.getElementById('view');
  view.classList.remove('fade-in');
  void view.offsetWidth;
  view.classList.add('fade-in');

  const actions = document.getElementById('page-actions');
  actions.innerHTML = '';

  switch (state.view) {
    case 'dashboard': setHeader('Inicio', 'Dashboard'); renderDashboard(view); break;
    case 'recordatorios': setHeader('Comunicación', 'Recordatorios de servicio'); renderRecordatorios(view); break;
    case 'clientes': setHeader('Personas', 'Clientes'); renderClientes(view); break;
    case 'vehiculos': setHeader('Personas', 'Vehículos'); renderVehiculos(view); break;
    case 'servicios': setHeader('Operación', 'Servicios realizados'); renderServicios(view); break;
    case 'tickets': setHeader('Operación', 'Tickets / Órdenes de trabajo'); renderTickets(view); break;
    case 'inventario': setHeader('Almacén', 'Inventario'); renderInventario(view); break;
    case 'config': setHeader('Sistema', 'Configuración'); renderConfig(view); setTimeout(updateTemplatePreviews, 50); break;
    default: view.innerHTML = '<div class="empty">Vista no encontrada</div>';
  }
  lucide.createIcons();
}

function setHeader(eyebrow, title) {
  document.getElementById('page-eyebrow').textContent = eyebrow;
  document.getElementById('page-title').textContent = title;
}

function setActions(html) {
  document.getElementById('page-actions').innerHTML = html;
  lucide.createIcons();
}

    .sort((a,b) => a.dias - b.dias);

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

          const st = reminderStatus(dias);
          const msg = buildMessage('whatsapp', cli, v, ult);

          const phoneIntl = '+' + phone;
          const wa = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
          const sms = `sms:${phoneIntl}?body=${encodeURIComponent(msgSms)}`;

          return `

              <div class="flex items-start justify-between gap-3 mb-3">

                </div>
                <span class="badge ${st.badge} shrink-0">${st.label}</span>
              </div>
              <div class="text-xs text-[var(--ink-muted)] uppercase tracking-wider font-semibold mb-1">Último servicio</div>
              <div class="text-sm mb-3">${escapeHtml(ult.tipo)} · ${fmtDate(ult.fecha)} · <span class="font-mono">${fmtKm(ult.km)}</span></div>
              <div class="text-xs text-[var(--ink-muted)] uppercase tracking-wider font-semibold mb-1">Próximo servicio</div>
              <div class="text-sm mb-4">${fmtDate(ult.proxFecha)}${ult.proxKm ? ' · <span class="font-mono">'+fmtKm(ult.proxKm)+'</span>' : ''}</div>
              <div class="flex flex-wrap gap-2 pt-3 border-t border-[var(--border)]">
                ${cli?.telefono ? `<a class="chip chip-wa" href="${wa}" target="_blank"><i data-lucide="message-circle" class="w-4 h-4"></i>WhatsApp</a>` : ''}
                ${cli?.telefono ? `<a class="chip chip-sms" href="${sms}"><i data-lucide="smartphone" class="w-4 h-4"></i>SMS</a>` : ''}

function buildMessage(type, cli, veh, ult) {
  const tpl = type === 'whatsapp' ? state.config.templateWhatsapp
            : type === 'sms' ? state.config.templateSms
            : state.config.templateEmail;
  return tpl
    .replace(/{nombre}/g, cli?.nombre || '')
    .replace(/{taller}/g, state.config.workshop || '')
    .replace(/{marca}/g, veh?.marca || '')
    .replace(/{modelo}/g, veh?.modelo || '')
    .replace(/{anio}/g, veh?.anio || '')
    .replace(/{placa}/g, veh?.placa || '')
    .replace(/{fecha}/g, fmtDate(ult?.proxFecha))
    .replace(/{ultimo_servicio_tipo}/g, ult?.tipo || '')
    .replace(/{ultimo_servicio_fecha}/g, fmtDate(ult?.fecha));
}

function editAndSend(clienteId, vehiculoId, ultId) {
  const cli = clienteById(clienteId);
  const v = vehiculoById(vehiculoId);
  const ult = state.servicios.find(s => s.id === ultId);
  if (!cli || !v || !ult) { toast('Datos incompletos', 'alert-circle'); return; }

  const defaultMsg = buildMessage('whatsapp', cli, v, ult);

  openModal(`
    <div class="p-6">
      <div class="font-display text-2xl font-semibold mb-1">Editar mensaje</div>
      <div class="text-sm text-[var(--ink-soft)] mb-4">Personaliza el mensaje para <strong>${escapeHtml(cli.nombre)}</strong> antes de enviarlo. Los cambios solo aplican a este envío.</div>

      <label class="label">Mensaje</label>
      <textarea id="edit-msg" class="textarea" rows="11" style="min-height:240px;font-family:'Plus Jakarta Sans',sans-serif;line-height:1.5">${escapeHtml(defaultMsg)}</textarea>
      <div class="text-xs text-[var(--ink-muted)] mt-2 flex items-center gap-2">
        <i data-lucide="info" class="w-3.5 h-3.5"></i>
        <span>Para cambiar la plantilla por defecto de todos los clientes, ve a <strong>Configuración → Plantillas</strong>.</span>
      </div>

      <div class="flex flex-wrap gap-2 mt-5 pt-4 border-t border-[var(--border)]">
        ${cli.telefono ? `<button class="chip chip-wa" onclick="sendEditedMessage('whatsapp','${clienteId}','${vehiculoId}')"><i data-lucide="message-circle" class="w-4 h-4"></i>Enviar por WhatsApp</button>` : ''}
        ${cli.telefono ? `<button class="chip chip-sms" onclick="sendEditedMessage('sms','${clienteId}','${vehiculoId}')"><i data-lucide="smartphone" class="w-4 h-4"></i>Enviar por SMS</button>` : ''}
        ${cli.email ? `<button class="chip chip-mail" onclick="sendEditedMessage('email','${clienteId}','${vehiculoId}')"><i data-lucide="mail" class="w-4 h-4"></i>Enviar por Email</button>` : ''}
        <button class="chip" onclick="resetEditedMessage('${clienteId}','${vehiculoId}','${ultId}')" title="Restaurar el texto original de la plantilla"><i data-lucide="rotate-ccw" class="w-4 h-4"></i>Restaurar</button>
        <button class="chip" onclick="copyEditedMessage()"><i data-lucide="copy" class="w-4 h-4"></i>Copiar</button>
        <div class="ml-auto"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>
      </div>
      ${!cli.telefono && !cli.email ? `
        <div class="mt-3 p-3 bg-[var(--warning-soft)] rounded-lg text-sm" style="color:#854D0E">
          <i data-lucide="alert-triangle" class="w-4 h-4 inline"></i>
          Este cliente no tiene teléfono ni email registrado. Agrégalos en <strong>Clientes</strong> para poder enviar.
        </div>` : ''}
    </div>
  `);
}

function sendEditedMessage(channel, clienteId, vehiculoId) {
  const cli = clienteById(clienteId);
  const v = vehiculoById(vehiculoId);
  const msg = document.getElementById('edit-msg').value.trim();
  if (!msg) { toast('El mensaje está vacío', 'alert-circle'); return; }

  let url;
  if (channel === 'whatsapp') {
    const phone = (state.config.country + (cli.telefono||'')).replace(/\D/g,'');
    url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  } else if (channel === 'sms') {
    const phone = '+' + (state.config.country + (cli.telefono||'')).replace(/\D/g,'');
    url = `sms:${phone}?body=${encodeURIComponent(msg)}`;
    window.location.href = url;
  } else if (channel === 'email') {
    const subject = 'Recordatorio de servicio' + (v ? ' - ' + v.marca + ' ' + v.modelo : '');
    url = `mailto:${cli.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(msg)}`;
    window.location.href = url;
  }
  toast('Abriendo ' + (channel==='whatsapp'?'WhatsApp':channel==='sms'?'mensajes':'correo') + '…');
}

function resetEditedMessage(clienteId, vehiculoId, ultId) {
  const cli = clienteById(clienteId);
  const v = vehiculoById(vehiculoId);
  const ult = state.servicios.find(s => s.id === ultId);
  const el = document.getElementById('edit-msg');
  if (el) {
    el.value = buildMessage('whatsapp', cli, v, ult);
    toast('Mensaje restaurado');
  }
}

function copyEditedMessage() {
  const el = document.getElementById('edit-msg');
  if (!el) return;
  el.select();
  try {
    navigator.clipboard.writeText(el.value).then(() => toast('Copiado al portapapeles', 'copy'));
  } catch {
    document.execCommand('copy');
    toast('Copiado al portapapeles', 'copy');
  }
}

async function saveCliente(id) {
  const nombre = document.getElementById('f-nombre').value.trim();
  if (!nombre) { toast('El nombre es obligatorio', 'alert-circle'); return; }
  const telefono = document.getElementById('f-telefono').value.trim().replace(/\D/g,'');
  if (telefono && telefono.length < 7) {
    toast('Teléfono incompleto', 'alert-circle');
    return;
  }
  const data = {
    id: id || uid('c_'),
    nombre,
    telefono,
    email: document.getElementById('f-email').value.trim(),
    notas: document.getElementById('f-notas').value.trim(),
    createdAt: id ? clienteById(id).createdAt : today()
  };
  if (id) {
    const i = state.clientes.findIndex(c => c.id === id);
    state.clientes[i] = { ...state.clientes[i], ...data };
  } else {
    state.clientes.push(data);
  }
  await saveTable('clientes', state.clientes);
  closeModal();
  toast(id ? 'Cliente actualizado' : 'Cliente creado');
  render();
}

async function deleteCliente(id) {
  const c = clienteById(id);

    ? `"${c.nombre}" se moverá a la papelera. Podrás restaurarlo después si fue por error.`

  if (activeVehs.length > 0) {
    desc += ` Sus ${activeVehs.length} vehículo(s) seguirán visibles pero sin dueño asignado.`;

  await softDeleteEntity('clientes', id);
  toast('Cliente movido a la papelera', 'trash-2');

async function permanentDeleteCliente(id) {

async function permanentDeleteVehiculo(id) {
  const v = state.vehiculos.find(x => x.id === id);
  const ss = serviciosByVehiculo(id);
  const desc = (v ? `"${v.marca} ${v.modelo}"` : 'El vehículo') + ' se eliminará permanentemente.' +
    (ss.length > 0 ? ` También se eliminarán sus ${ss.length} servicio(s) registrado(s).` : '') +
    ' Esta acción NO se puede deshacer.';
  const ok = await confirm2('¿Eliminar para siempre?', {
    description: desc,
    confirmText: 'Eliminar para siempre'
  });
  if (!ok) return;
  // Cascade: hard-delete services of this vehicle too
  state.servicios = state.servicios.filter(s => s.vehiculoId !== id);
  await saveTable('servicios', state.servicios);
  await permanentDeleteEntity('vehiculos', id);
  toast('Vehículo eliminado permanentemente', 'trash-2');
  render();
}

async function saveServicio(id) {
  const vehiculoId = document.getElementById('f-vehiculo').value;
  const fecha = document.getElementById('f-fecha').value;
  const km = Number(document.getElementById('f-km').value)||0;
  const meses = Number(document.getElementById('f-meses').value)||state.config.defaultMonths;
  const kmAdd = Number(document.getElementById('f-kmAdd').value)||state.config.defaultKm;

  const data = {
    id: id || uid('s_'),
    vehiculoId,
    tipo: document.getElementById('f-tipo').value.trim(),
    descripcion: document.getElementById('f-desc').value.trim(),
    fecha,
    km,
    costo: Number(document.getElementById('f-costo').value)||0,
    proxFecha: addMonths(fecha, meses),
    proxKm: km + kmAdd
  };
  if (id) {
    const i = state.servicios.findIndex(s => s.id === id);
    state.servicios[i] = { ...state.servicios[i], ...data };
  } else {
    state.servicios.push(data);
  }
  // also update vehicle kmActual if higher
  const v = vehiculoById(vehiculoId);
  if (v && km > v.kmActual) {
    v.kmActual = km;
    await saveTable('vehiculos', state.vehiculos);
  }
  await saveTable('servicios', state.servicios);
  closeModal();
  toast(id ? 'Servicio actualizado' : 'Servicio registrado');
  render();
}

async function deleteServicio(id) {

    description: s ? `El servicio "${s.tipo}" del ${fmtDate(s.fecha)} se moverá a la papelera. Podrás restaurarlo después.` : 'El servicio se moverá a la papelera.',
    confirmText: 'Mover a papelera'

  await softDeleteEntity('servicios', id);

function ticketById(id) { return state.tickets.find(t => t.id === id); }

function computeTicketTotals(t) {
  const subtotal = (t.items||[]).reduce((a, i) => a + (Number(i.cantidad)||0) * (Number(i.precioUnit)||0), 0) + (Number(t.manoObra)||0);
  const ivaPct = Number(t.ivaPercent ?? state.config.ivaPercent ?? 0);
  const iva = subtotal * (ivaPct/100);
  const total = subtotal + iva;
  return { subtotal, iva, total, ivaPct };
}

function fmtFolio(prefix, num) {
  return (prefix||'A') + '-' + String(num||0).padStart(4,'0');
}

function renderTickets(host) {
  if (state.view_ticket_id) {
    return renderTicketDetail(host, state.view_ticket_id);
  }
  const inTrash = state.subview === 'trash';
  const all = state.tickets;
  const active = all.filter(t => !t.deletedAt);
  const trashed = all.filter(t => t.deletedAt);

  setActions(trashActionsHTML('tickets', 'tickets', inTrash ? '' : `<button class="btn btn-primary" onclick="modalTicket()"><i data-lucide="plus" class="w-4 h-4"></i>Nuevo ticket</button>`));

  const q = (state.search||'').toLowerCase();
  const baseList = inTrash ? trashed : active;
  const list = [...baseList]
    .filter(t => {
      if (!q) return true;
      const v = vehiculoById(t.vehiculoId);
      const c = clienteById(t.clienteId);
      const hay = [t.folio, c?.nombre, v?.marca, v?.modelo, v?.placa].join(' ').toLowerCase();
      return hay.includes(q);
    })
    .sort((a,b) => inTrash ? (b.deletedAt||'').localeCompare(a.deletedAt||'') : (b.fecha||'').localeCompare(a.fecha||''));

  const totalCobrado = active.filter(t => t.estado==='pagado').reduce((a,t) => a + computeTicketTotals(t).total, 0);
  const totalPendiente = active.filter(t => t.estado==='pendiente').reduce((a,t) => a + computeTicketTotals(t).total, 0);

  host.innerHTML = `
    ${inTrash ? trashHelpHTML('tickets') : `
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">

        <div class="card card-tight"><div class="kpi-label">Pagados</div><div class="font-display text-2xl font-semibold mt-1">${active.filter(t=>t.estado==='pagado').length}</div></div>
        <div class="card card-tight"><div class="kpi-label">Cobrado</div><div class="font-display text-2xl font-semibold mt-1">${fmtMoney(totalCobrado)}</div></div>
        <div class="card card-tight" style="${totalPendiente>0?'background:#FEF3C7;border-color:#FCD34D':''}"><div class="kpi-label">Por cobrar</div><div class="font-display text-2xl font-semibold mt-1">${fmtMoney(totalPendiente)}</div></div>
      </div>
    `}
    ${!inTrash ? `
      <div class="mb-4">
        <input class="input max-w-md" placeholder="Buscar folio, cliente, vehículo o placa…" value="${escapeHtml(state.search)}" oninput="state.search=this.value; render()" />
      </div>
    ` : ''}
    <div class="card overflow-hidden">
      ${list.length === 0
        ? (inTrash
            ? `<div class="empty"><div class="empty-icon"><i data-lucide="trash-2" class="w-6 h-6"></i></div><div class="font-display text-2xl text-[var(--ink)]">Papelera vacía</div><div class="text-sm mt-2 mb-5">Los tickets eliminados aparecerán aquí.</div><button class="btn btn-primary" onclick="toggleSubview()"><i data-lucide="arrow-left" class="w-4 h-4"></i>Volver a tickets</button></div>`
            : emptyState('receipt', 'No hay tickets', 'Crea el primer ticket u orden de trabajo.', 'Nuevo ticket', 'modalTicket()')
          )
        : `
      <div class="overflow-x-auto">
        <table class="table">
          <thead><tr>
            <th>Folio</th><th>Fecha</th><th>Cliente</th><th>Vehículo</th><th>Total</th>
            ${inTrash ? '<th>Eliminado</th>' : '<th>Estado</th>'}
            <th></th>
          </tr></thead>
          <tbody>
            ${list.map(t => {
              const c = clienteById(t.clienteId);
              const v = vehiculoById(t.vehiculoId);
              const { total } = computeTicketTotals(t);
              const est = t.estado || 'pendiente';
              const badge = est==='pagado'?'badge-success':est==='cancelado'?'badge-danger':'badge-warning';
              const rowAttrs = inTrash ? 'style="opacity:0.75"' : `style="cursor:pointer" onclick='viewTicket(${JSON.stringify(t.id)})'`;
              return `
                <tr ${rowAttrs}>
                  <td class="font-mono font-semibold">${escapeHtml(t.folio)}</td>
                  <td class="text-sm">${fmtDate(t.fecha)}</td>

                    : `<td><span class="badge ${badge}">${est}</span></td>`}
                  <td class="text-right whitespace-nowrap" onclick="event.stopPropagation()">
                    ${inTrash ? `
                      <button class="btn btn-ghost btn-sm" onclick='restoreTicket(${JSON.stringify(t.id)})'><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>Restaurar</button>

function renderTicketItems() {
  const host = document.getElementById('t-items');
  if (!host) return;
  if (!window._ticketItems.length) {
    host.innerHTML = '<div class="text-sm text-[var(--ink-muted)] py-3 text-center border border-dashed border-[var(--border-strong)] rounded-lg">Toca "Agregar" para añadir refacciones</div>';
    return;
  }
  host.innerHTML = window._ticketItems.map((it, idx) => `
    <div class="grid grid-cols-12 gap-2 items-start">
      <input class="input col-span-6" placeholder="Descripción" value="${escapeHtml(it.descripcion)}" oninput="updateTicketItem(${idx},'descripcion',this.value)" />
      <input class="input col-span-2 text-right font-mono" type="number" step="0.01" placeholder="Cant" value="${it.cantidad}" oninput="updateTicketItem(${idx},'cantidad',this.value)" />
      <input class="input col-span-3 text-right font-mono" type="number" step="0.01" placeholder="P. Unit" value="${it.precioUnit}" oninput="updateTicketItem(${idx},'precioUnit',this.value)" />
      <button type="button" class="btn-icon col-span-1" onclick="removeTicketItem(${idx})"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
  `).join('');
  lucide.createIcons();
}
function addTicketItem() {
  window._ticketItems.push({ descripcion:'', cantidad:1, precioUnit:0 });
  renderTicketItems();
  recalcTicketTotal();
}
function removeTicketItem(idx) {
  window._ticketItems.splice(idx, 1);
  renderTicketItems();
  recalcTicketTotal();
}
function updateTicketItem(idx, field, value) {
  if (field === 'descripcion') window._ticketItems[idx][field] = value;
  else window._ticketItems[idx][field] = Number(value) || 0;
  recalcTicketTotal();
}
function ticketFormCliente(preferredVehId) {
  const clienteId = document.getElementById('t-cliente').value;
  const sel = document.getElementById('t-vehiculo');
  const vs = state.vehiculos.filter(v => !v.deletedAt && v.clienteId === clienteId);
  if (!clienteId) {
    sel.innerHTML = '<option value="">Primero selecciona un cliente</option>';
    return;
  }
  if (vs.length === 0) {
    sel.innerHTML = '<option value="">⚠ Este cliente no tiene vehículos registrados</option>';
    return;
  }
  sel.innerHTML = vs.map(v => `<option value="${v.id}" ${v.id===preferredVehId?'selected':''}>${escapeHtml(v.marca)} ${escapeHtml(v.modelo)} · ${escapeHtml(v.placa)}</option>`).join('');
}
function recalcTicketTotal() {
  const mo = Number(document.getElementById('t-manoObra')?.value) || 0;
  const iva = Number(document.getElementById('t-iva')?.value) || 0;
  const sub = (window._ticketItems||[]).reduce((a,i) => a + (Number(i.cantidad)||0)*(Number(i.precioUnit)||0), 0) + mo;
  const total = sub * (1 + iva/100);
  const disp = document.getElementById('t-total-display');
  if (disp) disp.textContent = fmtMoney(total);
}

async function saveTicket(id) {
  const clienteId = document.getElementById('t-cliente').value;
  const vehiculoId = document.getElementById('t-vehiculo').value;
  if (!clienteId) { toast('Selecciona un cliente', 'alert-circle'); return; }
  if (!vehiculoId) { toast('Selecciona un vehículo', 'alert-circle'); return; }
  const items = (window._ticketItems||[]).filter(i => i.descripcion?.trim());
  const data = {
    id: id || uid('t_'),
    folio: document.getElementById('t-folio').value.trim() || fmtFolio(state.config.folioPrefix, state.config.nextFolio),
    fecha: document.getElementById('t-fecha').value,
    clienteId,
    vehiculoId,
    items,
    manoObra: Number(document.getElementById('t-manoObra').value) || 0,
    descripcionManoObra: document.getElementById('t-mo-desc').value.trim(),
    ivaPercent: Number(document.getElementById('t-iva').value) || 0,
    notas: document.getElementById('t-notas').value.trim(),
    estado: document.getElementById('t-estado').value
  };
  if (id) {
    const i = state.tickets.findIndex(t => t.id === id);
    state.tickets[i] = { ...state.tickets[i], ...data };
  } else {
    state.tickets.push(data);
    // Increment folio
    state.config.nextFolio = (state.config.nextFolio || 1) + 1;
    await saveTable('config', state.config);
  }
  await saveTable('tickets', state.tickets);
  closeModal();
  toast(id ? 'Ticket actualizado' : 'Ticket creado');
  if (!id) { state.view_ticket_id = data.id; }
  render();
}

async function deleteTicket(id) {
  const t = ticketById(id);
  const ok = await confirm2('¿Eliminar este ticket?', {
    description: t?.folio ? `El ticket ${t.folio} se moverá a la papelera. Podrás restaurarlo después.` : 'Se moverá a la papelera. Podrás restaurarlo después.',
    confirmText: 'Mover a papelera'
  });
  if (!ok) return;
  await softDeleteEntity('tickets', id);
  if (state.view_ticket_id === id) state.view_ticket_id = null;
  toast('Movido a la papelera', 'trash-2');
  render();
}

async function restoreTicket(id) {
  await restoreEntity('tickets', id);
  toast('Ticket restaurado', 'rotate-ccw');
  render();
}

async function permanentDeleteTicket(id) {
  const t = state.tickets.find(x => x.id === id);
  const ok = await confirm2('¿Eliminar para siempre?', {
    description: t?.folio ? `El ticket ${t.folio} se eliminará permanentemente. Esta acción NO se puede deshacer.` : 'Esta acción NO se puede deshacer.',
    confirmText: 'Eliminar para siempre'
  });
  if (!ok) return;
  await permanentDeleteEntity('tickets', id);
  if (state.view_ticket_id === id) state.view_ticket_id = null;
  toast('Ticket eliminado permanentemente', 'trash-2');
  render();
}

function renderInventario(host) {
  const activos = state.productos.filter(p => !p.deletedAt);
  const papelera = state.productos.filter(p => p.deletedAt);
  const inTrash = state.subview === 'trash';

  if (inTrash) {
    setActions(trashActionsHTML('productos', 'productos'));
    return renderInventarioTrash(host, papelera);
  }

  setActions(trashActionsHTML('productos', 'productos', `
    <button class="btn btn-ghost btn-sm" onclick="exportInventarioCSV()"><i data-lucide="download" class="w-4 h-4"></i>Exportar CSV</button>
    <button class="btn btn-primary" onclick="modalProducto()"><i data-lucide="plus" class="w-4 h-4"></i>Nuevo producto</button>
  `));

  const q = (state.search||'').toLowerCase();
  const list = activos
    .filter(p => !q || p.nombre.toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q) || (p.categoria||'').toLowerCase().includes(q))

async function ajustarStock(id, delta) {
  const p = state.productos.find(x => x.id === id);
  if (!p) return;
  p.stock = Math.max(0, p.stock + delta);
  await saveTable('productos', state.productos);
  render();
}

function setupImageDrop() {
  setTimeout(() => {
    const drop = document.getElementById('img-drop');
    if (!drop) return;
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragging'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
    drop.addEventListener('drop', e => {
      e.preventDefault();
      drop.classList.remove('dragging');
      const file = e.dataTransfer.files[0];
      if (file) processProductImage(file);
    });
    lucide.createIcons();
  }, 50);
}

async function onProductImageSelected(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  await processProductImage(file);
  ev.target.value = ''; // permite re-seleccionar mismo archivo
}

async function processProductImage(file) {
  const zone = document.getElementById('img-zone');
  if (zone) zone.innerHTML = `<div class="image-drop"><i data-lucide="loader" class="w-6 h-6 animate-spin inline"></i> Procesando imagen…</div>`;
  lucide.createIcons();
  try {
    const dataUrl = await compressImage(file);
    window._productoImagen = dataUrl;
    refreshImageZone();
    toast('Imagen cargada');
  } catch (e) {
    toast(e.message || 'Error al procesar imagen', 'alert-circle');
    refreshImageZone();
  }
}

function removeProductImage() {
  window._productoImagen = '';
  refreshImageZone();
}

function refreshImageZone() {
  const zone = document.getElementById('img-zone');
  if (zone) {
    zone.innerHTML = imageZoneHTML();
    setupImageDrop();
    lucide.createIcons();
  }
}

async function saveProducto(id) {
  const data = {
    id: id || uid('p_'),
    nombre: document.getElementById('f-nombre').value.trim(),
    sku: document.getElementById('f-sku').value.trim().toUpperCase(),
    categoria: document.getElementById('f-cat').value.trim(),
    stock: Number(document.getElementById('f-stock').value)||0,
    stockMin: Number(document.getElementById('f-min').value)||0,
    precio: Number(document.getElementById('f-precio').value)||0,
    proveedor: document.getElementById('f-prov').value.trim(),
    imagen: window._productoImagen || ''
  };
  if (id) {
    const i = state.productos.findIndex(p => p.id === id);
    state.productos[i] = { ...state.productos[i], ...data };
  } else {
    state.productos.push(data);
  }
  await saveTable('productos', state.productos);
  window._productoImagen = '';
  closeModal();
  toast(id ? 'Producto actualizado' : 'Producto creado');
  render();
}

async function deleteProducto(id) {
  const p = state.productos.find(x => x.id === id);
  const ok = await confirm2('¿Eliminar este producto?', {
    description: p?.nombre ? `"${p.nombre}" se moverá a la papelera. Podrás restaurarlo después si lo eliminaste por error.` : 'El producto se moverá a la papelera. Podrás restaurarlo después.',
    confirmText: 'Mover a papelera'
  });
  if (!ok) return;
  await softDeleteEntity('productos', id);
  toast('Movido a la papelera', 'trash-2');
  render();
}

async function restoreProducto(id) {
  await restoreEntity('productos', id);
  toast('Producto restaurado', 'rotate-ccw');
  render();
}

async function permanentDeleteProducto(id) {
  const p = state.productos.find(x => x.id === id);
  const ok = await confirm2('¿Eliminar para siempre?', {
    description: p?.nombre ? `"${p.nombre}" se eliminará de forma permanente. Esta acción NO se puede deshacer.` : 'Esta acción NO se puede deshacer.',
    confirmText: 'Eliminar para siempre'
  });
  if (!ok) return;
  await permanentDeleteEntity('productos', id);
  toast('Producto eliminado permanentemente', 'trash-2');
  render();
}

function exportInventarioCSV() {
  const rows = [['Nombre','SKU','Categoría','Stock','Mínimo','Precio','Proveedor','Valor']];
  state.productos.filter(p => !p.deletedAt).forEach(p => rows.push([p.nombre, p.sku, p.categoria, p.stock, p.stockMin, p.precio, p.proveedor, (p.stock*p.precio).toFixed(2)]));
  const csv = rows.map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'inventario.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('Inventario exportado');
}

function applyTemplateSample(template) {
  const sample = {
    nombre: 'Nombre del cliente',
    taller: state.config.workshop || 'Taller Elvira',
    marca: 'Marca',
    modelo: 'Modelo',
    anio: 'Año',
    placa: 'PLACA',
    fecha: 'Fecha programada',
    ultimo_servicio_tipo: 'Tipo de servicio',
    ultimo_servicio_fecha: 'Fecha del último servicio'
  };
  let result = String(template || '');
  Object.entries(sample).forEach(([k, v]) => {
    result = result.split('{' + k + '}').join(v);
  });
  return result;
}

function whatsappFormat(text) {
  // *texto* se vuelve negrita en WhatsApp, _texto_ cursiva
  return escapeHtml(text)
    .replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>')
    .replace(/_([^_\n]+)_/g, '<em>$1</em>');
}

function updateTemplatePreviews() {
  const wa = document.getElementById('cf-twa');
  const sms = document.getElementById('cf-tsms');
  const mail = document.getElementById('cf-tmail');
  const pWa = document.getElementById('prev-wa');
  const pSms = document.getElementById('prev-sms');
  const pMail = document.getElementById('prev-email');
  if (wa && pWa) {
    const text = applyTemplateSample(wa.value);
    pWa.innerHTML = text.trim() ? whatsappFormat(text) : '<span class="msg-preview-empty">(vacío)</span>';
  }
  if (sms && pSms) {
    const text = applyTemplateSample(sms.value);
    pSms.textContent = text.trim() || '(vacío)';
    if (!text.trim()) pSms.innerHTML = '<span class="msg-preview-empty">(vacío)</span>';
  }
  if (mail && pMail) {
    const text = applyTemplateSample(mail.value);
    pMail.textContent = text.trim() || '(vacío)';
    if (!text.trim()) pMail.innerHTML = '<span class="msg-preview-empty">(vacío)</span>';
  }
}

async function saveConfig() {
  state.config = {
    ...state.config,
    workshop: document.getElementById('cf-workshop').value.trim() || 'Taller Elvira',
    country: document.getElementById('cf-country').value.trim().replace(/\D/g,'') || '52',
    phone: document.getElementById('cf-phone').value.trim(),
    address: document.getElementById('cf-address').value.trim(),
    rfc: (document.getElementById('cf-rfc')?.value || '').trim().toUpperCase(),
    folioPrefix: (document.getElementById('cf-fprefix')?.value || 'A').trim().toUpperCase() || 'A',
    nextFolio: Number(document.getElementById('cf-fnext')?.value) || 1,
    ivaPercent: Number(document.getElementById('cf-iva')?.value) || 0,
    defaultMonths: Number(document.getElementById('cf-months').value)||6,
    defaultKm: Number(document.getElementById('cf-km').value)||5000,
    reminderDays: Number(document.getElementById('cf-rdays').value)||30,
    reminderKm: Number(document.getElementById('cf-rkm').value)||500,
    templateWhatsapp: document.getElementById('cf-twa').value,
    templateSms: document.getElementById('cf-tsms').value,
    templateEmail: document.getElementById('cf-tmail').value
  };
  await saveTable('config', state.config);
  toast('Configuración guardada');
  render();
}

function exportAll() {
  const data = {
    exportedAt: new Date().toISOString(),
    version: 2,
    clientes: state.clientes,
    vehiculos: state.vehiculos,
    servicios: state.servicios,
    productos: state.productos,
    tickets: state.tickets,
    config: state.config
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'taller-elvira-respaldo-' + today() + '.json'; a.click();
  URL.revokeObjectURL(url);
  toast('Respaldo descargado');
}

async function importAll(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const ok = await confirm2('¿Reemplazar todos los datos?', {
    description: 'Esta acción borrará los datos actuales y los reemplazará con los del archivo de respaldo. Asegúrate de tener una copia antes de continuar.',
    confirmText: 'Sí, reemplazar',
    icon: 'upload'
  });
  if (!ok) { ev.target.value = ''; return; }
  const text = await file.text();
  try {
    const data = JSON.parse(text);
    state.clientes = data.clientes || [];
    state.vehiculos = data.vehiculos || [];
    state.servicios = data.servicios || [];
    state.productos = data.productos || [];
    state.tickets = data.tickets || [];
    if (data.config) state.config = { ...state.config, ...data.config };
    await persistAll();
    toast('Datos importados correctamente');
    render();
  } catch (e) {
    await alert2('Archivo inválido', {
      description: 'No se pudo leer el archivo de respaldo: ' + (e.message || 'formato incorrecto'),
      icon: 'alert-circle',
      danger: true
    });
  }
  ev.target.value = '';
}

async function resetAll() {
  const ok = await confirm2('¿Eliminar todos los datos?', {
    description: 'Se borrarán TODOS los clientes, vehículos, servicios, tickets, productos e imágenes. Esta acción NO se puede deshacer. Asegúrate de haber exportado un respaldo antes.',
    confirmText: 'Sí, eliminar todo',
    icon: 'alert-triangle'
  });
  if (!ok) return;
  state.clientes = []; state.vehiculos = []; state.servicios = []; state.productos = []; state.tickets = [];
  await persistAll();
  Storage.set('_seeded', '');
  Storage.set('_taller_elvira_clean_v2', '1');
  toast('Sistema reiniciado', 'trash-2');
  state.clientes = loadTable('clientes');
  state.vehiculos = loadTable('vehiculos');
  state.servicios = loadTable('servicios');
  state.productos = loadTable('productos');
  state.tickets = loadTable('tickets');
  render();
}

/* ============================================================
   CERRAR SESIÓN
============================================================ */

/*
 * El sistema actual no incluye una pantalla de acceso.
 * Déjalo vacío para mostrar una pantalla de "Sesión cerrada".
 * Cuando agregues un login, cambia el valor por './login.html'.
 */
const LOGIN_PAGE = '';

async function cerrarSesion() {
  const confirmar = await confirm2('¿Cerrar sesión?', {
    description:
      'Se finalizará el acceso en este dispositivo. Los clientes, vehículos, servicios, tickets e inventario no serán eliminados.',
    confirmText: 'Cerrar sesión',
    cancelText: 'Permanecer',
    danger: false,
    icon: 'log-out'
  });

  if (!confirmar) return;

  toggleSidebar(false);

  const boton = document.getElementById('logout-btn');
  if (boton) {
    boton.classList.add('is-loading');
    boton.innerHTML = `
      <i data-lucide="loader-circle" class="w-4 h-4 animate-spin"></i>
      <span>Cerrando sesión…</span>
    `;
  }

  const overlay = document.createElement('div');
  overlay.className = 'logout-overlay';
  overlay.setAttribute('role', 'status');
  overlay.setAttribute('aria-live', 'polite');
  overlay.innerHTML = `
    <div class="logout-card">
      <div class="logout-symbol">
        <i data-lucide="log-out" style="width:32px;height:32px"></i>
      </div>
      <div class="logout-title">Cerrando sesión</div>
      <div class="logout-description">
        Estamos finalizando el acceso y protegiendo la información del taller.
      </div>
      <div class="logout-progress"></div>
    </div>
  `;

  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';

  const aplicacion = document.querySelector('body > .flex.min-h-screen');
  if (aplicacion) aplicacion.classList.add('app-logging-out');

  lucide.createIcons();

  /*
   * Solo se eliminan claves de autenticación.
   * No se utiliza localStorage.clear(), porque borraría los datos
   * de clientes, vehículos, servicios, tickets e inventario.
   */
  sessionStorage.removeItem('taller_session');
  localStorage.removeItem('taller_session');

  setTimeout(() => {
    if (LOGIN_PAGE) {
      window.location.replace(LOGIN_PAGE);
      return;
    }

    mostrarPantallaSesionCerrada(overlay);
  }, 1200);
}

function mostrarPantallaSesionCerrada(overlay) {
  overlay.innerHTML = `
    <div class="logout-card">
      <div class="logout-symbol">
        <i data-lucide="shield-check" style="width:34px;height:34px"></i>
      </div>
      <div class="logout-title">Sesión cerrada</div>
      <div class="logout-description">
        El acceso se cerró correctamente. Los datos del taller permanecen
        guardados en este dispositivo.
      </div>
      <button
        type="button"
        class="btn btn-primary logout-return-btn"
        onclick="window.location.reload()"
      >
        <i data-lucide="log-in" class="w-4 h-4"></i>
        Volver a ingresar
      </button>
    </div>
  `;

  lucide.createIcons();
}

async function init() {
  try {
    await prepareEmptyInitialData();
    state.clientes = loadTable('clientes');
    state.vehiculos = loadTable('vehiculos');
    state.servicios = loadTable('servicios');
    state.productos = loadTable('productos');
    state.tickets = loadTable('tickets');
    const cfg = loadTable('config', null);
    if (cfg && !Array.isArray(cfg)) state.config = { ...state.config, ...cfg };
    render();
  } catch (e) {
    console.error('Error inicializando:', e);
    document.getElementById('view').innerHTML = `
      <div class="card card-pad" style="max-width:520px;margin:40px auto;text-align:center">
        <div class="font-display text-2xl mb-2">No se pudo cargar el sistema</div>
        <div class="text-sm text-[var(--ink-soft)] mb-4">${escapeHtml(e.message||'Error desconocido')}</div>
        <button class="btn btn-primary" onclick="location.reload()">Reintentar</button>
      </div>`;
  }
}

// Tecla Escape cierra modales
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('modal-host').children.length) {
    closeModal();
  }
});

// Refrescar al volver a la pestaña (por si cambiaron los datos en otra)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.view) {
    state.clientes = loadTable('clientes');
    state.vehiculos = loadTable('vehiculos');
    state.servicios = loadTable('servicios');
    state.productos = loadTable('productos');
    state.tickets = loadTable('tickets');
    render();
  }
});

init();
</script>

<script>

    navigator.serviceWorker.register('./sw.js')
      .then(r => console.log('✅ SW registrado:', r.scope))

// Banner "Instalar app" — aparece automáticamente en Android Chrome
let _pwaPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _pwaPrompt = e;

  // Crear botón de instalación en el sidebar
  const btnInstalar = document.createElement('div');
  btnInstalar.id = 'pwa-install-btn';
  btnInstalar.style.cssText = `
    margin: 8px 10px 4px;
    padding: 10px 14px;
    background: #DC2626;
    color: white;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
  `;
  btnInstalar.innerHTML = '📲 Instalar app en este dispositivo';
  btnInstalar.onmouseenter = () => btnInstalar.style.background = '#B91C1C';
  btnInstalar.onmouseleave = () => btnInstalar.style.background = '#DC2626';
  btnInstalar.onclick = async () => {
    _pwaPrompt.prompt();
    const { outcome } = await _pwaPrompt.userChoice;
    if (outcome === 'accepted') btnInstalar.remove();
    _pwaPrompt = null;
  };

  // Insertar al inicio del nav
  const nav = document.getElementById('nav');
  if (nav && nav.parentNode) nav.parentNode.insertBefore(btnInstalar, nav);
});

// Cuando ya está instalada como app
window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('pwa-install-btn');
  if (btn) btn.remove();
  console.log('✅ App instalada correctamente');
});
</script>
